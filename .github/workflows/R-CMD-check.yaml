name: R-CMD-check

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_KEEP_PKG_SOURCE: yes
  MAKEFLAGS: -j1
  _R_CHECK_LIMIT_CORES_: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-release
            os: ubuntu-latest
            r: release
          - name: ubuntu-oldrel
            os: ubuntu-latest
            r: oldrel-1
          - name: ubuntu-devel
            os: ubuntu-latest
            r: devel
            http-user-agent: release
          - name: macos-release
            os: macos-latest
            r: release
          - name: windows-release
            os: windows-latest
            r: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          Ncpus: 1
          use-public-rspm: true
          http-user-agent: ${{ matrix.http-user-agent }}

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-results: true
