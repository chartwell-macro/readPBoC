name: Test coverage

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_KEEP_PKG_SOURCE: yes
  MAKEFLAGS: -j1
  _R_CHECK_LIMIT_CORES_: true

jobs:
  coverage:
    name: ubuntu-release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          Ncpus: 1
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::xml2
          needs: coverage

      - name: Compute package coverage
        shell: Rscript {0}
        run: |
          coverage <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "readPBOC-package")
          )
          print(coverage)
          covr::to_cobertura(coverage, filename = "cobertura.xml")

      - name: Upload Cobertura report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-cobertura
          path: cobertura.xml
          if-no-files-found: error
          retention-days: 14
